name: moto_gastos_app
description: "Aplicativo para gerenciamento de custos, consumo e manutenções de uma motocicleta."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.4.2
  path: ^1.8.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  csv: ^6.0.0
  share_plus: ^11.1.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  file_picker: ^11.0.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"